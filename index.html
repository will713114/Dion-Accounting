<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7557d9">
<title>Dion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6fa;font-family:Arial;color:#292534}
header{background:linear-gradient(135deg,#7557d9,#9d7ce8);color:#fff;padding:30px 22px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:34px}.sub{opacity:.85}.card{background:#ffffff25;padding:18px;margin-top:22px;border-radius:20px}
.big{font-size:32px;font-weight:bold;margin:6px 0}.stats{display:flex;gap:10px}.stats div{flex:1;background:#ffffff20;padding:12px;border-radius:14px}
main{padding:20px;max-width:550px;margin:auto}.buttons{display:flex;gap:12px}.buttons button{flex:1}
button,input,select{padding:13px;border:0;border-radius:12px;font-size:15px}
button{font-weight:bold}.inc{background:#e4f7ec;color:#187d4b}.exp{background:#fde8ec;color:#bd4056}
.title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.title input{width:145px}
.item{background:white;padding:14px;margin:9px 0;border-radius:15px;display:flex;justify-content:space-between}
.meta{font-size:12px;color:#888;margin-top:4px}.amt{font-weight:bold}.green{color:#16804b}.red{color:#c23e55}
.mini{padding:4px 7px;font-size:11px;margin:6px 0 0 3px}.empty{text-align:center;color:#999;padding:30px}
#modal{display:none;position:fixed;inset:0;background:#0006;align-items:flex-end}
.sheet{background:white;width:100%;max-width:550px;margin:auto;padding:22px;border-radius:24px 24px 0 0}
.sheet input,.sheet select{width:100%;border:1px solid #ddd;margin:5px 0 10px}.save{width:100%;background:#7557d9;color:white}.cancel{width:100%;margin-top:7px}
</style>
</head>
<body>

<header>
<h1>Dion</h1>
<div class="sub">Personal Money Tracker</div>
<div class="card">
<div>Total Balance</div><div class="big" id="bal">RM 0.00</div>
<div class="stats">
<div>Income<br><b id="inc">RM 0.00</b></div>
<div>Expenses<br><b id="exp">RM 0.00</b></div>
</div>
</div>
</header>

<main>
<div class="buttons">
<button class="inc" onclick="openF('Income')">+ Add Income</button>
<button class="exp" onclick="openF('Expense')">− Add Expense</button>
</div>

<div class="title">
<b>Transactions</b>
<input type="month" id="month" onchange="show()">
</div>
<div id="list"></div>
</main>

<div id="modal">
<div class="sheet">
<h2 id="ft">Add Expense</h2>
<input type="number" id="amount" placeholder="Amount (RM)" step=".01">
<select id="cat"></select>
<input id="note" placeholder="Description">
<input type="date" id="date">
<button class="save" onclick="save()">Save Transaction</button>
<button class="cancel" onclick="closeF()">Cancel</button>
</div>
</div>

<script>
let T=JSON.parse(localStorage.dion||"[]"),type="Expense",eid=null;
const E=["Food","Shopping","Transport","Bills","Home","Travel","Entertainment","Freelance","House Loan","Car Loan","Insurance","Others"];
const I=["Salary","Freelance Income","Bonus","Other Income"];
const $=x=>document.getElementById(x);
const rm=x=>"RM "+Number(x).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
$("month").value=today().slice(0,7);

function openF(t,o){
 type=t;eid=o?o.id:null;$("ft").innerText=(o?"Edit ":"Add ")+t;
 $("cat").innerHTML=(t=="Expense"?E:I).map(x=>`<option>${x}</option>`).join("");
 $("amount").value=o?o.amount:"";$("note").value=o?o.note:"";
 $("date").value=o?o.date:today();if(o)$("cat").value=o.cat;
 $("modal").style.display="flex"
}
function closeF(){$("modal").style.display="none";eid=null}
function save(){
 let a=+$("amount").value;if(a<=0)return alert("Please enter an amount.");
 let o={id:eid||Date.now(),type,amount:a,cat:$("cat").value,note:$("note").value,date:$("date").value};
 T=eid?T.map(x=>x.id==eid?o:x):[...T,o];localStorage.dion=JSON.stringify(T);closeF();show()
}
function del(id){if(confirm("Delete this transaction?")){T=T.filter(x=>x.id!=id);localStorage.dion=JSON.stringify(T);show()}}
function edit(id){let o=T.find(x=>x.id==id);openF(o.type,o)}
function show(){
 let m=$("month").value,F=T.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)),i=0,e=0;
 F.forEach(x=>x.type=="Income"?i+=x.amount:e+=x.amount);
 $("inc").innerText=rm(i);$("exp").innerText=rm(e);$("bal").innerText=rm(i-e);
 $("list").innerHTML=F.length?F.map(x=>`<div class="item"><div><b>${x.cat}</b><div class="meta">${x.date}${x.note?" • "+x.note:""}</div></div><div><div class="amt ${x.type=="Income"?"green":"red"}">${x.type=="Income"?"+":"−"} ${rm(x.amount)}</div><button class="mini" onclick="edit(${x.id})">Edit</button><button class="mini" onclick="del(${x.id})">Delete</button></div></div>`).join(""):`<div class="empty">No transactions yet.</div>`
}
show();
</script>
</body>
</html>
